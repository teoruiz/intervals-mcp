minimum_prek_version = "0.4.0"

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-added-large-files", args = ["--maxkb=1024"] },
  { id = "check-case-conflict" },
  { id = "check-illegal-windows-names" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-merge-conflict" },
  { id = "detect-private-key" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "gofmt",
    name = "gofmt",
    language = "system",
    entry = "gofmt -w",
    files = "\\.go$",
  },
  {
    id = "go-mod-verify",
    name = "go mod verify",
    language = "system",
    entry = "go mod verify",
    pass_filenames = false,
    files = "^go\\.(mod|sum)$",
    env = { GOCACHE = "/tmp/go-build-cache" },
  },
  {
    id = "go-vet",
    name = "go vet",
    language = "system",
    entry = "go vet ./...",
    pass_filenames = false,
    files = "(\\.go$|^go\\.(mod|sum)$)",
    env = { GOCACHE = "/tmp/go-build-cache" },
  },
  {
    id = "go-test-short",
    name = "go test -short",
    language = "system",
    entry = "go test -buildvcs=false -short ./...",
    pass_filenames = false,
    files = "(\\.go$|^go\\.(mod|sum)$)",
    env = { GOCACHE = "/tmp/go-build-cache" },
  },
  {
    id = "golangci-lint",
    name = "golangci-lint",
    language = "system",
    entry = "golangci-lint run",
    pass_filenames = false,
    files = "(\\.go$|^go\\.(mod|sum)$)",
    env = { GOCACHE = "/tmp/go-build-cache", GOLANGCI_LINT_CACHE = "/tmp/golangci-lint-cache" },
  },
]
