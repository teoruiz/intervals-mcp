# fly.toml app configuration file generated for intervals-mcp on 2026-06-01T13:03:33+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'intervals-mcp'
primary_region = 'cdg'

[build]
  [build.args]
    GO_VERSION = '1.26.3'

[env]
  MCP_ADDR = ':8080'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
