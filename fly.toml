# Example Fly.io configuration for intervals-mcp.
# Change app, primary_region, MCP_PUBLIC_URL, and scaling settings for your own deployment.
# Store credentials with `fly secrets set`; do not put Intervals.icu or Supabase secrets here.

app = 'your-intervals-mcp-app'
primary_region = 'iad'

[build]
  [build.args]
    GO_VERSION = '1.26.3'

[env]
  MCP_ADDR = ':8080'
  MCP_PUBLIC_URL = 'https://your-intervals-mcp-app.fly.dev'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
